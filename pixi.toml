[workspace]
authors = ["Hadrien Mary <hadrien.mary@gmail.com>"]
channels = ["conda-forge"]
name = "moku"
platforms = ["osx-arm64", "linux-64"]
version = "0.2.0"

[tasks]
lint = "ruff check src scripts tools tests && ruff format --check src scripts tools tests"
format = "ruff check --fix src scripts tools tests && ruff format src scripts tools tests"
test = "pytest -q tests"

[dependencies]
python = ">=3.14,<3.15"
pytorch = ">=2.13.0,<3"
torchvision = ">=0.28.0,<0.29"
transformers = ">=5.16.1,<6"
accelerate = ">=1.15.0,<2"
datasets = ">=5.0.1,<6"
huggingface_hub = ">=1.32.0,<2"
torchmetrics = ">=1.9.0,<2"
pycocotools = ">=2.0.11,<3"
onnx = ">=1.23.0,<2"
onnxruntime = ">=1.30.0,<2"
onnxscript = ">=0.7.2,<0.8"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
scikit-learn = ">=1.9.1,<2"
pandas = ">=3.0.6,<4"
matplotlib = ">=3.11.2,<4"
pillow = ">=12.3.0,<13"
google-genai = ">=2.24.0,<3"
python-dotenv = ">=1.2.3,<2"
typer = ">=0.27.2,<0.28"
rich = ">=15.0.0,<16"
ruff = ">=0.16.8,<0.17"
pytest = ">=9.1.1,<10"

[pypi-dependencies]
moku = { path = ".", editable = true }
faster-coco-eval = ">=1.8.0, <2"
# From PyPI: albucore imports `simsimd`, which conda-forge 7.x only ships as `numkong`.
albumentations = ">=2.0.8, <3"
